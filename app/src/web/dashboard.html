<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет — ML Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">ML Service</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link active" href="/dashboard">Кабинет</a>
            <a class="nav-link" href="/history">История</a>
            <button class="btn btn-outline-light ms-3" type="button" data-logout>Выйти</button>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div id="page-message" class="alert" hidden></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Личный кабинет</h1>
            <span class="text-secondary" id="profile-email"></span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card panel-card">
                <div class="card-body p-4">
                    <h2 class="h5">Баланс</h2>
                    <div class="balance-value"><span id="balance-value">0.00</span> <small class="fs-6">кредитов</small></div>
                    <hr>
                    <form id="top-up-form">
                        <label class="form-label" for="top-up-amount">Сумма пополнения</label>
                        <div class="input-group">
                            <input class="form-control" id="top-up-amount" name="amount" type="number" min="0.01" step="0.01" required>
                            <button class="btn btn-success" type="submit">Пополнить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card panel-card">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3">Новое предсказание</h2>
                    <form id="prediction-form">
                        <div class="mb-3">
                            <label class="form-label" for="model">Модель</label>
                            <select class="form-select" id="model" name="model">
                                <option value="average">Среднее значение — 10 кредитов</option>
                                <option value="sum">Сумма — 5 кредитов</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="features">Признаки в формате JSON</label>
                            <textarea class="form-control font-monospace" id="features" rows="6" required>{"x1": 1.2, "x2": 5.7}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="features-file">Или загрузите JSON-файл</label>
                            <input class="form-control" id="features-file" type="file" accept="application/json,.json">
                        </div>
                        <button class="btn btn-primary" type="submit">Отправить задачу</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <section class="card panel-card mt-4" id="prediction-result" hidden>
        <div class="card-body p-4">
            <h2 class="h5 mb-3">Результат</h2>
            <div class="row g-3 mb-3">
                <div class="col-md-4"><strong>Статус:</strong> <span id="result-status"></span></div>
                <div class="col-md-4"><strong>Предсказание:</strong> <span id="result-value"></span></div>
                <div class="col-md-4"><strong>Списано:</strong> <span id="result-charge"></span></div>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <h3 class="h6 text-success">Обработанные данные</h3>
                    <pre class="bg-light border rounded p-3" id="processed-data"></pre>
                </div>
                <div class="col-md-6">
                    <h3 class="h6 text-danger">Отклонённые данные</h3>
                    <pre class="bg-light border rounded p-3" id="invalid-data"></pre>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="/static/js/common.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
