<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>История — ML Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">ML Service</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="/dashboard">Кабинет</a>
            <a class="nav-link active" href="/history">История</a>
            <button class="btn btn-outline-light ms-3" type="button" data-logout>Выйти</button>
        </div>
    </div>
</nav>

<main class="container-fluid px-lg-5 py-4">
    <h1 class="h3 mb-4">История операций</h1>
    <div id="history-message" class="alert" hidden></div>

    <section class="card panel-card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">ML-запросы</h2>
            <p id="predictions-empty" class="text-secondary">Запросов пока нет.</p>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Дата</th><th>Модель</th><th>Данные</th><th>Результат</th><th>Отклонено</th><th>Списано</th><th>Статус</th>
                    </tr>
                    </thead>
                    <tbody id="predictions-body"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section class="card panel-card">
        <div class="card-body">
            <h2 class="h5 mb-3">Транзакции</h2>
            <p id="transactions-empty" class="text-secondary">Транзакций пока нет.</p>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead><tr><th>Дата</th><th>Операция</th><th>Сумма</th><th>ML-задача</th><th>Статус</th></tr></thead>
                    <tbody id="transactions-body"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script src="/static/js/common.js"></script>
<script src="/static/js/history.js"></script>
</body>
</html>
