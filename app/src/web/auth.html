<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — ML Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">ML Service</a>
    </div>
</nav>

<main class="container py-5">
    <div id="auth-message" class="alert" hidden></div>
    <div class="row g-4 justify-content-center">
        <div class="col-lg-5">
            <div class="card panel-card">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4">Вход</h1>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label" for="login-email">Email</label>
                            <input class="form-control" id="login-email" name="email" type="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="login-password">Пароль</label>
                            <input class="form-control" id="login-password" name="password" type="password" minlength="8" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Войти</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card panel-card">
                <div class="card-body p-4">
                    <h2 class="h4 mb-4">Регистрация</h2>
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label" for="register-email">Email</label>
                            <input class="form-control" id="register-email" name="email" type="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="register-password">Пароль</label>
                            <input class="form-control" id="register-password" name="password" type="password" minlength="8" maxlength="128" required>
                        </div>
                        <button class="btn btn-outline-primary w-100" type="submit">Создать аккаунт</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="/static/js/common.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
